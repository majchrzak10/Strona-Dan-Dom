# =============================================================================
# GBP Reviews — automatyczne odpowiedzi na nowe opinie (Rogoźno / Wągrowiec)
#
# Raz dziennie. 4–5★ → „Bardzo dziękujemy za opinię!”.
# 1–3★ → bez odpowiedzi, zakłada issue w GitHubie (mail z powiadomieniem).
# Sekrety: GBP_CLIENT_ID, GBP_CLIENT_SECRET, GBP_REFRESH_TOKEN
#
# Skrypt: automation/gbp-reviews/reply-reviews.mjs
# Stan:   automation/gbp-reviews/state.json (commitowany automatycznie)
# =============================================================================
name: GBP Reviews — odpowiedzi na opinie

on:
  schedule:
    - cron: "13 16 * * *"   # codziennie ok. 17:13 czasu polskiego (zima)
  workflow_dispatch:

concurrency:
  group: gbp-reviews
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  reply:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Odpowiedzi na nowe opinie
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node automation/gbp-reviews/reply-reviews.mjs
      - name: Zapis stanu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/gbp-reviews/state.json
          if git diff --cached --quiet; then
            echo "Brak zmian stanu."
          else
            git commit -m "chore(gbp-reviews): aktualizacja stanu [skip ci]"
            git pull --rebase origin main && git push origin HEAD:main || echo "::warning::Nie udało się zapisać stanu GBP Reviews."
          fi
